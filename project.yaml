# CRE project settings. Targets define rpcs (and optionally account) groups.
# Chain names validated against `cre workflow supported-chains`.
# RPC URLs support ${VAR} syntax resolved from .env / shell environment.

staging-settings:
  rpcs:
    - chain-name: polygon-testnet-amoy
      url: https://rpc-amoy.polygon.technology

production-settings:
  rpcs:
    - chain-name: polygon-mainnet
      url: ${POLYGON_RPC_URL}
